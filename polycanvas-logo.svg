<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect width="120" height="120" rx="28" fill="url(#pc-bg)"/>
  <!-- canvas frame, offset to suggest an edgeless surface -->
  <rect x="22" y="30" width="60" height="48" rx="8" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"/>
  <rect x="38" y="42" width="60" height="48" rx="8" stroke="#FFFFFF" stroke-width="6"/>
  <!-- connector between two nodes -->
  <path d="M50 66 L86 66" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round"/>
  <circle cx="50" cy="66" r="7" fill="#FFFFFF"/>
  <circle cx="86" cy="66" r="7" fill="#FFFFFF"/>
</svg>
